name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Accept licenses
      run: yes | sdkmanager --licenses || true
      
    - name: Install SDK components
      run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
    
    - name: Copy frontend files
      run: |
        mkdir -p mobile/android/app/src/main/assets/www
        cp mobile/index.html mobile/android/app/src/main/assets/www/
        cp mobile/styles.css mobile/android/app/src/main/assets/www/
        cp mobile/app.js mobile/android/app/src/main/assets/www/
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2
    
    - name: Build with Gradle
      working-directory: ./mobile/android
      run: |
        gradle wrapper --gradle-version 8.2
        ./gradlew assembleDebug --info
      env:
        ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: debug-apk
        path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
