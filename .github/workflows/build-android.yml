name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Accept licenses
      run: yes | sdkmanager --licenses || true
      
    - name: Install SDK components
      run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
    
    - name: Copy frontend files
      run: |
        mkdir -p mobile/android/app/src/main/assets/www
        cp mobile/index.html mobile/android/app/src/main/assets/www/
        cp mobile/styles.css mobile/android/app/src/main/assets/www/
        cp mobile/app.js mobile/android/app/src/main/assets/www/
    
    - name: Download and Setup Gradle
      run: |
        cd mobile/android
        # 下载 Gradle Wrapper
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.1/gradle/wrapper/gradle-wrapper.jar || \
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.2.1/gradle/wrapper/gradle-wrapper.jar
        ls -la gradle/wrapper/
    
    - name: Build APK
      working-directory: ./mobile/android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
      env:
        ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        
    - name: Check Build Output
      if: failure()
      working-directory: ./mobile/android
      run: |
        echo "=== Build Log ==="
        cat build.log || echo "No build.log"
        echo "=== Directory Structure ==="
        find . -name "*.apk" -o -name "build.gradle" | head -20
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: debug-apk
        path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
