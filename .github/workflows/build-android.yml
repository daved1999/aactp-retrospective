name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Accept Android Licenses
      run: yes | sdkmanager --licenses || true
    
    - name: Install Android Build Tools
      run: sdkmanager "build-tools;34.0.0" "platforms;android-34"
    
    - name: Copy frontend files to Android assets
      run: |
        mkdir -p mobile/android/app/src/main/assets/www
        cp mobile/index.html mobile/android/app/src/main/assets/www/
        cp mobile/styles.css mobile/android/app/src/main/assets/www/
        cp mobile/app.js mobile/android/app/src/main/assets/www/
        echo "✅ Frontend files copied"
    
    - name: Generate Gradle Wrapper
      working-directory: ./mobile/android
      run: |
        # 安装 Gradle
        sudo apt-get update
        sudo apt-get install -y gradle
        # 生成 wrapper
        gradle wrapper --gradle-version 8.2
        ls -la gradle/wrapper/
    
    - name: Build Debug APK
      working-directory: ./mobile/android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
      env:
        ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: AACTP-Retrospective-Debug
        path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
