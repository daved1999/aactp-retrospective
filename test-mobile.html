<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>移动端效果测试 - AACTP项目复盘</title>
  <link rel="stylesheet" href="mobile/styles.css">
  <style>
    /* 测试专用样式 */
    .test-info {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 1000;
    }
    .device-simulator {
      border: 3px solid #333;
      margin: 20px auto;
      overflow: hidden;
      resize: both;
    }
    .test-controls {
      text-align: center;
      padding: 20px;
      background: #f0f0f0;
    }
    .test-controls button {
      margin: 5px;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="test-controls">
    <h2>📱 移动端效果测试工具</h2>
    <p>点击下方按钮模拟不同设备，或手动调整窗口大小</p>
    <button onclick="setDevice('iphone-se')">iPhone SE (375×667)</button>
    <button onclick="setDevice('iphone-12')">iPhone 12 (390×844)</button>
    <button onclick="setDevice('android')">Android (360×640)</button>
    <button onclick="setDevice('tablet')">平板 (768×1024)</button>
    <button onclick="toggleOrientation()">🔄 切换横竖屏</button>
    <button onclick="resetSize()">重置大小</button>
  </div>

  <div id="device-frame" class="device-simulator" style="width: 375px; height: 667px;">
    <!-- 这里嵌入移动端应用 -->
    <iframe src="mobile/index.html" style="width: 100%; height: 100%; border: none;"></iframe>
  </div>

  <div class="test-info">
    当前尺寸: <span id="size-display">375×667</span><br>
    模式: <span id="mode-display">竖屏</span><br>
    侧边栏: <span id="sidebar-status">收起</span>
  </div>

  <script>
    const deviceFrame = document.getElementById('device-frame');
    const sizeDisplay = document.getElementById('size-display');
    const modeDisplay = document.getElementById('mode-display');
    const sidebarStatus = document.getElementById('sidebar-status');
    
    let isPortrait = true;
    
    function setDevice(device) {
      const sizes = {
        'iphone-se': { width: 375, height: 667 },
        'iphone-12': { width: 390, height: 844 },
        'android': { width: 360, height: 640 },
        'tablet': { width: 768, height: 1024 }
      };
      
      const size = sizes[device];
      if (isPortrait) {
        deviceFrame.style.width = size.width + 'px';
        deviceFrame.style.height = size.height + 'px';
      } else {
        deviceFrame.style.width = size.height + 'px';
        deviceFrame.style.height = size.width + 'px';
      }
      updateDisplay();
    }
    
    function toggleOrientation() {
      isPortrait = !isPortrait;
      const width = deviceFrame.style.width;
      const height = deviceFrame.style.height;
      deviceFrame.style.width = height;
      deviceFrame.style.height = width;
      updateDisplay();
    }
    
    function resetSize() {
      deviceFrame.style.width = '375px';
      deviceFrame.style.height = '667px';
      isPortrait = true;
      updateDisplay();
    }
    
    function updateDisplay() {
      sizeDisplay.textContent = deviceFrame.offsetWidth + '×' + deviceFrame.offsetHeight;
      modeDisplay.textContent = isPortrait ? '竖屏' : '横屏';
      
      // 检测侧边栏状态
      const iframe = document.querySelector('iframe');
      if (iframe && iframe.contentWindow) {
        try {
          const sidebar = iframe.contentDocument.querySelector('.sidebar');
          if (sidebar) {
            sidebarStatus.textContent = sidebar.classList.contains('active') ? '展开' : '收起';
          }
        } catch(e) {
          // 跨域问题，忽略
        }
      }
    }
    
    // 监听窗口大小变化
    new ResizeObserver(updateDisplay).observe(deviceFrame);
    
    // 定期更新侧边栏状态
    setInterval(updateDisplay, 1000);
    
    // 初始化显示
    updateDisplay();
    
    console.log('✅ 移动端测试工具已加载');
    console.log('📱 请使用浏览器开发者工具（F12）的移动端模拟功能获得最佳效果');
  </script>
</body>
</html>
