// Top-level build file
buildscript {
    ext {
        kotlin_version = '1.9.0'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// 项目仓库已在 settings.gradle 中配置
// 不要在此处添加 repositories
allprojects {
    // 项目级配置（不含仓库）
}
